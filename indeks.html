<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Lab Maya Model Atom</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:#1b1464;font-family:'Trebuchet MS','Segoe UI',sans-serif}
#st{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;background:linear-gradient(135deg,#fff3b0,#ffd6e8 45%,#b8f1ff);border-radius:18px;overflow:hidden;color:#2b2160}
#hd{height:80px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(90deg,#7b5cff,#ff5fa2 60%,#ffb347);box-shadow:0 6px 0 #5a3fd0;position:relative;z-index:2}
#hd h1{font-size:20px;color:#fff;line-height:1.1;width:215px;text-shadow:0 3px 0 #4b2fb5}#hd small{font-size:11px;font-weight:400}
#tabs{display:flex;gap:6px;flex:1}
.b{--c:#ff5fa2;border:0;border-radius:14px;padding:9px 14px;font:700 14px inherit;font-family:inherit;color:#fff;background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 70%,#000));box-shadow:0 5px 0 color-mix(in srgb,var(--c) 45%,#000),0 8px 12px #0003;cursor:pointer;transition:.1s}
.b:hover{filter:brightness(1.1)}.b:active{transform:translateY(4px);box-shadow:0 1px 0 #0006}.tb.on{--c:#22c55e;transform:translateY(-2px)}
.tb{--c:#3b82f6}
#dev{display:flex;gap:8px;align-items:center;color:#fff;font-size:11px;line-height:1.25;width:250px}
#ph{width:56px;height:56px;border-radius:50%;border:3px dashed #fff;background:#fff3 center/cover;display:grid;place-items:center;cursor:pointer;font-size:22px;flex:none;overflow:hidden}
.pg{display:none;position:absolute;top:92px;left:14px;right:14px;bottom:14px}.pg.on{display:block}
.card{background:#fffc;border-radius:18px;box-shadow:0 6px 0 #0002,0 10px 20px #0002;padding:12px 16px}
#mc{display:flex;gap:10px;height:100px}.mc{flex:1;border-radius:16px;border:0;cursor:pointer;color:#fff;font:700 15px inherit;font-family:inherit;background:var(--c);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 50%,#000);transition:.15s}
.mc.on{transform:translateY(-6px) scale(1.04);outline:4px solid #fff}.mc span{font-size:32px;display:block}
#dt{margin-top:16px;height:496px;display:flex;gap:16px}#dt h3{font-size:16px;margin:0 0 4px}#dt p{font-size:15.5px;line-height:1.45}
#il{width:250px;text-align:center;font-size:90px;border-radius:18px;background:var(--c);color:#fff;padding-top:30px;box-shadow:0 6px 0 #0003}#il div{font-size:16px;font-weight:700;padding:10px;line-height:1.4}
#ps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.ps{display:flex;gap:10px;padding:8px 12px;height:128px}.ps i{flex:none;width:34px;height:34px;border-radius:50%;background:#7b5cff;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}.ps p{font-size:13px;line-height:1.32}.ps b{display:block;font-size:14px;color:#7b5cff}
#sm{display:flex;gap:10px;height:100%}#cv{border-radius:18px;box-shadow:0 6px 0 #0004;display:block}
#rp{width:340px;display:flex;flex-direction:column;gap:10px}#ctl{display:flex;flex-wrap:wrap;gap:8px}#ro{font-size:13.5px;line-height:1.5;flex:1}#hint{font-size:13px;background:#fff7c2;border-radius:12px;padding:8px 10px;line-height:1.35}
#sb{display:flex;gap:8px;margin-bottom:8px}#sb .b{flex:1;padding:8px 4px;font-size:13px}
#qs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.q{padding:4px 10px;height:178px;font-size:11.8px;overflow:hidden}.q b{font-size:12.2px;display:block;margin-bottom:3px;line-height:1.25}.q label{display:block;padding:1px 6px;border-radius:8px;cursor:pointer;line-height:1.25}.q label:hover{background:#ffe29a}.q input{margin-right:5px}
#nm{display:flex;gap:8px;align-items:center}#nm input[type=text]{padding:7px 10px;border-radius:10px;border:2px solid #7b5cff;font:14px inherit;width:300px}
#nl{display:flex;gap:12px;height:100%}#sc{width:420px;text-align:center}#sc .n{font-size:84px;font-weight:800;color:#7b5cff;line-height:1}
.bd{display:inline-block;margin:3px;padding:7px 10px;border-radius:14px;background:#fff;font-size:12.5px;font-weight:700;box-shadow:0 3px 0 #0003}.bd.off{opacity:.35;filter:grayscale(1)}
#fb{flex:1;display:flex;flex-direction:column;gap:6px}.fb{padding:6px 12px;font-size:12px;line-height:1.3;flex:1}
#ts{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:#2b2160;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;display:none;z-index:9}

#lb{position:absolute;top:80px;left:0;height:5px;width:0;background:#22c55e;z-index:4;border-radius:0 4px 4px 0}
#sp{position:absolute;inset:0;z-index:50;background:radial-gradient(circle at 25% 40%,#7b5cff,#2a1a80 70%);display:flex;align-items:center;justify-content:center;gap:60px;color:#fff;transition:opacity .6s}
#sp.out{opacity:0;pointer-events:none}
#sf{position:relative;width:340px;height:340px;flex:none}#sf img{position:absolute;inset:50px;width:240px;height:240px;border-radius:50%;object-fit:cover;object-position:center 22%;border:6px solid #fff;box-shadow:0 10px 30px #0006}
.ob{position:absolute;inset:0;border:2px dashed #fff6;border-radius:50%;animation:sp 8s linear infinite}.ob.b2{inset:18px;animation-duration:12s;animation-direction:reverse}.ob i{position:absolute;top:-9px;left:50%;width:18px;height:18px;border-radius:50%;background:#ffd43b;box-shadow:0 0 14px #ffd43b}.b2 i{background:#4dd0ff;box-shadow:0 0 14px #4dd0ff}
@keyframes sp{to{transform:rotate(360deg)}}
#sx{width:560px}#sx h2{font-size:46px;line-height:1.1;text-shadow:0 5px 0 #4b2fb5}#sx p{font-size:17px;margin-top:10px;opacity:.95}
#lt{margin-top:26px;height:22px;border-radius:12px;background:#0004;overflow:hidden;box-shadow:inset 0 3px 6px #0006}#lf{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#ffd43b,#ff5fa2);transition:width .25s}
#lm{margin-top:8px;font-size:14px;display:flex;justify-content:space-between}#go{margin-top:20px;font-size:24px;padding:14px 46px;--c:#22c55e;opacity:.4;pointer-events:none}#go.rdy{opacity:1;pointer-events:auto;animation:pl 1s infinite}

const EL=[['H',16,'#ff6b6b'],['O',22,'#4dabf7'],['C',20,'#94a3b8'],['N',19,'#a78bfa'],['Na',26,'#fbbf24']];
function addD(){const e=EL[S.a.length%5];S.a.push({x:80+Math.random()*700,y:80+Math.random()*380,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,r:e[1],c:e[2],l:e[0]});ro()}

function exc(){if(S.n>=5||S.ph.some(p=>p.k=='in'))return tn(200,.2,'sawtooth');const w=1240/Math.abs(-13.6/(S.n+1)**2+13.6/S.n**2);S.ph.push({k:'in',x:30,y:CY,c:wc(w),n:S.n,w})}

function ball(x,y,r,c0,c1,t){const g=cx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);g.addColorStop(0,c0);g.addColorStop(1,c1);cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();if(t){cx.fillStyle='#fff';cx.font=`700 ${r*.9}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(t,x,y+1)}}

if(mode=='thomson'){ball(CX,CY,200,'#ffc2d6','#ff4f81');for(let i=0;i<30;i++){const a=i*2.4,r=190*Math.sqrt((i+.5)/30)*.95;lb('+',CX+r*Math.cos(a),CY+r*Math.sin(a),'#fff9',18)}

if(mode=='ruth'){const nx=560;cx.strokeStyle='#ffffff30';cx.setLineDash([5,6]);cx.beginPath();cx.arc(nx,CY,230,0,7);cx.stroke();cx.setLineDash([]);ball(nx,CY,14+Math.sin(T*3)*1.5,'#fff','#ff3b3b','+');lb('Inti (+)',nx,CY-26,'#ffb4b4',13);cx.fillStyle='#94a3b8';cx.fillRect(10,CY-18,22,36);lb('Sumber α',34,CY+40,'#cbd5e1',12);lb('Hamburan sinar alfa pada lempeng emas',W/2,28);
for(const p of S.p){if(p.d)continue;for(let k=0;k<2;k++){const dx=p.x-nx,dy=p.y-CY,r=Math.max(4,Math.hypot(dx,dy)),a=720/(r*r);p.vx+=a*dx/r;p.vy+=a*dy/r;p.x+=p.vx;p.y+=p.vy}p.t.push([p.x,p.y]);if(p.t.length>70)p.t.shift();p.f++;

S.p=S.p.filter(p=>!p.d||p.t.length>0&&(p.t.shift(),p.t.length>0))}
if(mode=='bohr'){for(let n=1;n<=5;n++){cx.strokeStyle=n==S.n?'#ffe066':'#ffffff35';cx.lineWidth=n==S.n?3:1;cx.beginPath();cx.arc(CX,CY,46*n,0,7);cx.stroke();lb('n='+n,CX+46*n+16,CY-4,'#fff9',12)}
ball(CX,CY,17,'#fff','#ff3b3b','p+');S.a+=.07/S.n;const ex=CX+46*S.n*Math.cos(S.a),ey=CY+46*S.n*Math.sin(S.a);ball(ex,ey,10,'#bff','#0ea5e9','e');
